[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lock-smith-mcp"
version = "0.1.0"
description = "MCP server for LockSmith — pay-per-call x402 endpoint security audits over x402 ($0.50 USDC on Base)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jobfile Studio" }]
keywords = ["mcp", "x402", "base", "usdc", "security", "audit", "agents"]
dependencies = [
    # mcp 2.x renamed FastMCP -> MCPServer; this package targets the v1
    # SDK API that current MCP hosts and docs are built against.
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "eth-account>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lock-smith-mcp = "lock_smith_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lock_smith_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
